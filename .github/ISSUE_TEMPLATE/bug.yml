name: 缺陷
description: 报告一个缺陷
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请不要在 issue 里粘贴密钥、令牌、客户数据或内部地址。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 实际行为，以及你期望的行为。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 运行的命令
        2. 策略或参数（去掉真实客户数据）
        3. 实际输出
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: `aag --version` 的输出。
      placeholder: "0.1.0"
    validations:
      required: false
  - type: dropdown
    id: usage
    attributes:
      label: 使用场景（选填）
      options:
        - 学习 / 了解
        - 个人项目
        - 公司内部试点
        - 已在生产环境
    validations:
      required: false
